# Local integration test stack for MemStack.
# Usage: docker compose up -d
# Then run pnpm test:e2e against the real instances.
# Tear down: docker compose down -v

version: "3.8"

services:
  # PostgreSQL 17 with pgvector extension for vector similarity search
  postgres:
    image: pgvector/pgvector@sha256:be400b50812ab2cc908ed78593fda2e51e3b45fe774fa637f1c7b16e68531d95
    environment:
      POSTGRES_USER: memstack
      POSTGRES_PASSWORD: memstack
      POSTGRES_DB: memstack
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memstack"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Stack with RediSearch module for full-text search
  redis:
    image: redis/redis-stack-server@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Neo4j 5 graph database with APOC plugin for graph storage
  neo4j:
    image: neo4j@sha256:937fbd163e302a5751dd329b719c1b05e2a4293af223d61b1aa17e3dea087709
    environment:
      NEO4J_AUTH: neo4j/memstack123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p memstack123 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Qdrant vector database for high-performance similarity search
  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"   # HTTP API
      - "6334:6334"   # gRPC
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Weaviate vector database with anonymous access for local development
  weaviate:
    image: semitechnologies/weaviate:1.38.1
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "8080:8080"
      - "50051:50051"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: memstack
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
