id: memstack-release-artifact
product: memstack
claim: The selected MemStack revision builds and its public in-memory adapter completes a store, get, and count journey.
setup:
  - corepack enable
  - pnpm --dir "${target}" install --frozen-lockfile
  - pnpm --dir "${target}" build
steps:
  - name: exercise the selected target artifact
    run: node "${target}/scripts/verification/val-smoke.mjs"
    expect:
      - exitCode: 0
      - jsonPath: $.status
        equals: ok
      - jsonPath: $.id
        exists: true
      - jsonPath: $.count
        equals: 1
      - outputContains: MemStack evidence survives a real store and retrieval journey.
rubric:
  - id: public-artifact-journey
    criterion: A clean consumer can store and retrieve a memory through the built public artifact.
    weight: high
