name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: node scripts/verification/check-versions.mjs
      - run: pnpm build:all
      - run: pnpm publish -r --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: node scripts/verification/check-versions.mjs
      - run: pnpm build:all
      - name: Build release candidate
        run: docker build --file packages/server/Dockerfile --tag memstack-release-candidate .
      - name: Smoke-test release candidate
        run: pnpm smoke:docker
        env:
          MEMSTACK_DOCKER_IMAGE: memstack-release-candidate
          MEMSTACK_DOCKER_SKIP_BUILD: "true"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/isiomac/memstack-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Push verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag memstack-release-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
