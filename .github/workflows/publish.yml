name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Do not set registry-url: it writes an empty auth config that
          # prevents npm from initiating its OIDC trusted-publishing flow.
          package-manager-cache: false
      - name: Setup npm
        run: npm install --global npm@12.0.2
      - name: Verify npm Trusted Publishing prerequisites
        run: |
          node --version
          npm --version
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - run: node scripts/verification/check-versions.mjs
      - run: pnpm build:all
      - name: Pack publishable packages
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/memstack-packages"
          mkdir -p "$PACK_DIR"
          pnpm --filter @memstack/core pack --pack-destination "$PACK_DIR"
          pnpm --filter @memstack/cli pack --pack-destination "$PACK_DIR"
          pnpm --filter @memstack/mcp pack --pack-destination "$PACK_DIR"
          pnpm --filter @memstack/server pack --pack-destination "$PACK_DIR"
      - name: Publish @memstack/core
        run: npm publish "$RUNNER_TEMP/memstack-packages/memstack-core-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
      - name: Publish @memstack/cli
        run: npm publish "$RUNNER_TEMP/memstack-packages/memstack-cli-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
      - name: Publish @memstack/mcp
        run: npm publish "$RUNNER_TEMP/memstack-packages/memstack-mcp-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
      - name: Publish @memstack/server
        run: npm publish "$RUNNER_TEMP/memstack-packages/memstack-server-${GITHUB_REF_NAME#v}.tgz" --provenance --access public
      # npm Trusted Publishing exchanges this job's OIDC identity for a
      # short-lived publish credential. No NPM_TOKEN secret is used.

  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: node scripts/verification/check-versions.mjs
      - run: pnpm build:all
      - name: Build release candidate
        run: docker build --file packages/server/Dockerfile --tag memstack-release-candidate .
      - name: Smoke-test release candidate
        run: pnpm smoke:docker
        env:
          MEMSTACK_DOCKER_IMAGE: memstack-release-candidate
          MEMSTACK_DOCKER_SKIP_BUILD: "true"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/isiomac/memstack-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Push verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag memstack-release-candidate "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
