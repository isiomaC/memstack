name: Val release evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: isiomaC/val@v1
        with:
          scenarios: scenarios/val/
          judge: none
          target-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          artifact-name: memstack-val-evidence
