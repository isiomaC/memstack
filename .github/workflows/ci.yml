name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm check:all
      - run: pnpm test:unit
      - run: pnpm build:all
      - run: pnpm smoke:artifacts

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
          bun: "true"
      - run: pnpm test:packages
      - run: pnpm smoke:packages

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - name: Run real-backend E2E
        run: bash e2e/run-all.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: artifacts/e2e/
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: pnpm build:all
      - run: pnpm smoke:docker
        env:
          VERIFICATION_ARTIFACT_DIR: artifacts/docker
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: artifacts/docker/
          if-no-files-found: warn

  mcp-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: 22
      - run: pnpm smoke:mcp-docker

  verification:
    if: always()
    name: verification
    needs: [runtime, packages, e2e, docker, mcp-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write summary
        run: >-
          bash scripts/verification/summary.sh
          "runtime=${{ needs.runtime.result }}"
          "packages=${{ needs.packages.result }}"
          "e2e=${{ needs.e2e.result }}"
          "docker=${{ needs.docker.result }}"
          "mcp-docker=${{ needs.mcp-docker.result }}"
      - name: Require every verification job
        env:
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          MCP_DOCKER_RESULT: ${{ needs.mcp-docker.result }}
        run: |
          test "$RUNTIME_RESULT" = success
          test "$PACKAGES_RESULT" = success
          test "$E2E_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$MCP_DOCKER_RESULT" = success
